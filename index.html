<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chọn bài Reading</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6edd6;--paper:#fffaf0;--ink:#35271b;--mut:#7a6650;--brown:#7a4a1e;--orange:#f1a55a;--red:#c0392b;--olive:#8b9a4b;--gold:#b98a2e}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--ink);font:400 16px/1.6 'Be Vietnam Pro',system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(rgba(122,74,30,.12) 1px,transparent 1.2px);background-size:22px 22px}
.wrap{max-width:1100px;margin:0 auto}
header{margin:14px 4px 18px}
h1{font:italic 700 clamp(34px,6vw,54px)/1.05 'Cormorant Garamond',serif;color:var(--red);margin:0 0 6px;text-shadow:2px 2px 0 rgba(241,165,90,.35)}
header p{margin:0;color:var(--mut)}
#nudge{margin:0 4px 16px;padding:10px 14px;border:2px dashed var(--orange);border-radius:12px;background:#ffe9cc;font-size:14.5px}
#nudge:empty{display:none}
#nudge button{font:inherit;font-weight:600;margin-left:6px;cursor:pointer;border-radius:16px;border:1px solid var(--brown);background:var(--brown);color:#fff;padding:2px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin:0 4px 30px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--paper);border:2px solid var(--olive);border-radius:14px;padding:22px 18px 16px;
  color:inherit;text-decoration:none;box-shadow:0 6px 16px rgba(80,50,20,.16);transition:transform .15s,box-shadow .15s}
.card::before{content:"";position:absolute;top:-9px;left:24px;width:64px;height:16px;background:rgba(139,154,75,.7);transform:rotate(-3deg)}
a.card:hover,a.card:focus-visible{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 12px 24px rgba(80,50,20,.25);outline:none}
a.card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.chip{align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.03em;background:#ffe3bd;color:var(--brown);border-radius:12px;padding:1px 10px}
.card h2{font:700 24px/1.15 'Cormorant Garamond',serif;margin:4px 0 0;color:var(--brown)}
.q{font-size:13.5px;color:var(--mut)}
.st{margin-top:auto;padding-top:10px;font-size:13.5px;border-top:1px dashed rgba(122,74,30,.35)}
.go{font-weight:700;color:var(--red)}
.card.soon{opacity:.6;border-style:dashed;cursor:not-allowed}
.card.soon .go{color:var(--mut)}
@media (prefers-reduced-motion:reduce){.card{transition:none}a.card:hover{transform:none}}
</style>
</head>
<body>
<main class="wrap">
  <div id="rdbar"></div>
  <header>
    <h1>Chọn bài Reading</h1>
    <p>Bấm vào một bài để bắt đầu. Kết quả mỗi lần làm được lưu vào lịch sử của bạn.</p>
  </header>
  <div id="nudge"></div>
  <section class="grid" id="grid" aria-label="Danh sách bài đọc"></section>
</main>
<script src="config.js"></script>
<script src="passages.js"></script>
<script src="tracker.js"></script>
<script>
(function(){
  var h=Tracker.h, P=window.RD_PASSAGES||[];
  Tracker.mountBar({home:false});
  var grid=document.getElementById("grid"), nudge=document.getElementById("nudge");
  var pct=function(a){return a.total?a.score/a.total:0};

  function stat(list){
    if(!list.length)return "Chưa làm bài này";
    var last=list[list.length-1],best=list.reduce(function(b,a){return pct(a)>pct(b)?a:b});
    return list.length+" lần · gần nhất "+last.score+"/"+last.total+" · cao nhất "+best.score+"/"+best.total;
  }

  async function render(){
    var hist=null,fail=false,u=Tracker.user();
    if(u){try{hist=await Tracker.history()}catch(e){fail=true}}
    nudge.textContent="";
    if(!u){
      nudge.append("Bạn chưa đăng nhập, nên kết quả sẽ không được lưu. ",
        h("button",{type:"button",text:"Đăng nhập",onclick:function(){Tracker.openLogin()}}));
    }else if(fail){
      nudge.textContent="Không tải được lịch sử lúc này. Bạn vẫn làm bài bình thường.";
    }
    grid.textContent="";
    P.forEach(function(p){
      var ready=!!p.file;
      var mine=(hist||[]).filter(function(a){return a.passage===p.id});
      var kids=[
        h("span",{class:"chip",text:p.topic||"Reading"}),
        h("h2",{text:p.title}),
        h("div",{class:"q",text:p.q||""}),
        h("div",{class:"st"},
          u&&ready&&!fail?h("div",{text:stat(mine)}):null,
          h("div",{class:"go",text:ready?"Làm bài →":"Sắp có"}))
      ];
      grid.appendChild(ready
        ? h.apply(null,["a",{class:"card",href:p.file}].concat(kids))
        : h.apply(null,["div",{class:"card soon","aria-disabled":"true"}].concat(kids)));
    });
  }
  Tracker.onChange(render);
  render();
})();
</script>
</body>
</html>
